spring:
  application:
    name: chainsignal-backend
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:chainsignal}
    username: ${POSTGRES_USER:chainsignal}
    password: ${POSTGRES_PASSWORD:chainsignal_local_dev}

server:
  port: 8080

chainsignal:
  events:
    default-limit: ${EVENT_DEFAULT_LIMIT:100}
    max-limit: ${EVENT_MAX_LIMIT:500}
    default-radius-km: ${EVENT_DEFAULT_RADIUS_KM:100}
    max-radius-km: ${EVENT_MAX_RADIUS_KM:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
