services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: chainsignal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chainsignal}
      POSTGRES_USER: ${POSTGRES_USER:-chainsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainsignal_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chainsignal_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  chainsignal_postgres_data:
