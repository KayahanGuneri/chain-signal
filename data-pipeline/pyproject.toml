[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chainsignal-data-pipeline"
version = "0.1.0"
description = "ChainSignal data engineering and anomaly pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=20",
    "pydantic>=2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
chainsignal_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["chainsignal_pipeline"]


[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
